<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background-image:url("{{ url_for('static', filename='images.jpg') }}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        .login-box{
            width:500px;
            background:rgba(255,255,255,0.9);
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Student Login</h2>

    <form action="/login" method="POST">

        <label>Roll Number</label>
        <input type="text" name="rollno" required>

        <label>Password (Student Name)</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
